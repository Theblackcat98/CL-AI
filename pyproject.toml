[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cl-ai"
version = "0.1.0"
authors = [
  { name="CL AI Contributor", email="contributor@example.com" },
]
description = "A minimal command-line tool to get bash commands from local LLMs."
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Topic :: Utilities",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "rich>=13.7.0",
    "aiohttp>=3.8.0",
    "pydantic>=2.5.2",
]

[project.scripts]
cl-ai = "cl_ai.__main__:main"

[project.urls]
"Homepage" = "https://github.com/Theblackcat98/CL-AI"
"Bug Tracker" = "https://github.com/Theblackcat98/CL-AI/issues"

[project.optional-dependencies]
dev = [
    "flake8>=6.0.0",
]

[tool.flake8]
max-line-length = 79

[tool.setuptools]
packages = ["cl_ai"]
